name: Release

# Push a tag like v1.1.0: builds the portable exe and the installer, then attaches both to the
# GitHub release (created from CHANGELOG.md if it does not exist yet), with SHA256 checksums. The winget
# manifest for the release is kept as a workflow artifact.
# A tag with a hyphen (v1.0.0-rc1) makes a pre-release and is never submitted to winget.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Integration tests need a real audio device, which CI runners do not have.
      - name: Test
        run: dotnet test -c Release --filter "Category!=Integration"

      - name: Publish
        run: >
          dotnet publish src/SonicScrewdriver -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none
          -p:Version=${{ steps.v.outputs.version }} -o publish

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q installer\SonicScrewdriver.iss /DAppVersion=${{ steps.v.outputs.version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The hash is computed from the exact file that gets uploaded, so winget always matches.
      - name: Checksums and winget manifest
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $setup = "publish/SonicScrewdriver-Setup-$v.exe"
          Get-ChildItem publish/SonicScrewdriver.exe, $setup | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content publish/SHA256SUMS.txt
          ./installer/make-winget-manifest.ps1 -Version $v -Setup $setup -Repo "${{ github.repository }}" -OutDir "publish/winget-$v"

      # Not a release asset (winget only needs the installer URL and hash): kept on the run for submission.
      - name: Keep winget manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: winget-manifest-${{ steps.v.outputs.version }}
          path: publish/winget-${{ steps.v.outputs.version }}

      # Signed proof that these files were built by this workflow from this commit.
      # Verify with: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            publish/SonicScrewdriver.exe
            publish/SonicScrewdriver-Setup-${{ steps.v.outputs.version }}.exe

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          BASE="${VERSION%%-*}"                       # 1.0.0-rc1 -> 1.0.0 (changelog section)
          case "$VERSION" in *-*) PRE="--prerelease" ;; *) PRE="" ;; esac
          FILES=("publish/SonicScrewdriver.exe" "publish/SonicScrewdriver-Setup-${VERSION}.exe" "publish/SHA256SUMS.txt")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            awk -v v="$BASE" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
            [ -s notes.md ] || awk '$0 ~ "^## \\[Unreleased\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "Sonic Screwdriver ${VERSION}" --notes-file notes.md $PRE
          fi

  # Defender + VirusTotal on the published files; adds the VirusTotal links to the release notes.
  scan:
    needs: release
    uses: ./.github/workflows/scan.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  # Opens a pull request on microsoft/winget-pkgs for the new version (official wingetcreate tool).
  # Needs the secret WINGET_TOKEN (classic token, public_repo scope) and a fork of winget-pkgs; skipped
  # without the secret and for pre-release tags (v1.2.0-rc1). The package must already exist in
  # winget-pkgs: the very first version is submitted by hand.
  # Put the secret in the "winget" environment and add yourself as required reviewer there to approve
  # each submission.
  winget:
    needs: [release, scan]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    environment: winget
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget-pkgs
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/SonicScrewdriver-Setup-$v.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update Leroidubid.SonicScrewdriver --version $v --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
