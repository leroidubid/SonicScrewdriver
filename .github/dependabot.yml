version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One PR for the test tooling. NAudio (the only runtime dependency) stays on its own:
      # it needs a manual test on real audio before merging.
      test-tools:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
